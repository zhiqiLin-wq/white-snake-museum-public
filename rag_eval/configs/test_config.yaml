# RAG 检索评估系统 — 主配置文件
# 基于: rag-evaluation-test-design.md v1.0
# 最后更新: 2026-08-12 (v2: 移除 Reranker R 配置, D/S/F 三配置)

evaluation:
  dataset:
    path: "rag_eval/ground_truth"
    corpus_file: "corpus.jsonl"
    queries_file: "queries_daily_deepseek.jsonl"
    qrels_file: "qrels_daily_deepseek.tsv"
    ci_queries_file: "queries_ci.jsonl"
  top_k: 10
  search_top_k: 20
  batch_top_k: 50

configs:
  # D — Dense Only (仅语义检索)
  D:
    bm25_enabled: false
    reranker_enabled: false
    dense_candidate_k: 100
    sparse_candidate_k: 0
    reranker_output_k: 10
    fusion_method: "score_normalized"
    fusion_k: 20
    fusion_dense_weight: 0.5  # v4: Dense比Sparse好，提升权重

  # S — Sparse Only (仅 BM25)
  S:
    bm25_enabled: true
    reranker_enabled: false
    note: "直接调用 BM25Retriever.search()，跳过三阶段管道"

  # F — Fusion (双路 score_normalized 融合)
  F:
    bm25_enabled: true
    reranker_enabled: false
    fusion_method: "score_normalized"
    fusion_k: 50
    fusion_dense_weight: 0.5  # v4: score_normalized 替代 rrf，保留分数分辨率
    dense_candidate_k: 100
    sparse_candidate_k: 100
    reranker_output_k: 10
    note: "Dense + Sparse score_normalized融合。候选池扩大至100。已移除Reranker(R)。"

metrics:
  primary:
    - recall_at_10
    - recall_at_5
    - recall_at_3
    - mrr
    - ndcg_at_10
    - binary_ndcg_at_10
    - hit_at_1
    - precision_at_10
    - f1_at_10
    - average_precision
    - r_precision
  diagnostic:
    - coverage_at_10
    - false_positive_rate_at_10
    - filter_precision_at_10
    - fusion_delta
    - unique_from_dense
    - unique_from_sparse
  statistical:
    - bootstrap_confidence_interval
    - paired_bootstrap_test
    - cohens_d

thresholds:
  recall_at_10_fail: 0.65
  recall_at_10_warn: 0.75
  mrr_fail: 0.40
  mrr_warn: 0.55
  ndcg_at_10_fail: 0.50
  ndcg_at_10_warn: 0.65

output:
  log_level: "INFO"
  report_format: ["txt", "json"]
  history_dir: "rag_eval/results/history"
  save_per_query_results: true
