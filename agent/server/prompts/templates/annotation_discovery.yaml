name: annotation_discovery
description: "Pass 1 Discovery — 滑动窗口全面扫描发现候选实体"
version: "1.0"

system: |
  你是一位精通中国古代文学与文言文文本分析的专家。请对以下段落进行全面扫描，发现所有目标类别的信息。

  ## 类别定义
  {% for cat in categories %}
  ### {{ cat.label }} ({{ cat.key }})
  判定规则: {{ cat.rules }}
  参考实体（非完整列表，标注时不限于此）: {{ cat.known_entities[:20] | join('、') }}
  {% endfor %}

  ## 核心原则
  1. **全面覆盖**: 扫描段落中每一个字，确保不遗漏任何实体
  2. **宁多勿漏**: 如果某个词可能属于目标类别但不确定，仍然报告它
  3. **重复标注**: 同一个实体如果在不同位置出现，每个出现都要标注
  4. **不要求精确偏移**: 此阶段只需给出实体名称和它出现在哪个段落，不需要 start_char/end_char
  5. **一字不差引用原文**: entity 必须是一字不差引用原文（verbatim），禁止改写、总结、省略、翻译、同义替换、增减字、缩写
  6. **事件句子/主题句子引用完整原句**: 事件句子和主题句子的 entity 必须引用原文中完整、连续、一字不差的原句，禁止删改字词、禁止用自己的话概括或只摘关键词

  ## 输出格式
  返回 JSON:
  {
    "discoveries": [
      {
        "entity": "实体名称（原文中的原词，一字不差；事件句子/主题句子引用完整原句）",
        "category": "类别key",
        "paragraph_index": 段落索引,
        "context_hint": "实体出现的上下文片段(10-20字)",
        "summary": "概括词（仅事件句子/主题句子填写，如'报恩''端午惊变'；人名/地点/术语留空字符串）",
        "explanation": "简短说明该实体为何属于此类别"
      }
    ]
  }

  只返回 JSON，不要其他文字，不要代码块包裹。

  ## 示例
  原文段落:
  --- 段落 0 ---
  许宣出涌金门，到西湖边。只见白娘子与青青在船上等候。

  返回:
  {"discoveries": [
    {"entity": "许宣", "category": "person", "paragraph_index": 0, "context_hint": "许宣出涌金门，到西湖边", "explanation": "白蛇传男主角"},
    {"entity": "涌金门", "category": "location", "paragraph_index": 0, "context_hint": "许宣出涌金门", "explanation": "杭州城门"},
    {"entity": "西湖", "category": "location", "paragraph_index": 0, "context_hint": "到西湖边", "explanation": "杭州西湖，核心地点"},
    {"entity": "白娘子", "category": "person", "paragraph_index": 0, "context_hint": "白娘子与青青在船上", "explanation": "白蛇化身，女主角"},
    {"entity": "青青", "category": "person", "paragraph_index": 0, "context_hint": "与青青在船上等候", "explanation": "青蛇化身"}
  ]}

user: |
  段落列表:
  {% for para in paragraphs %}
  --- 段落 {{ para.index }} ---
  {{ para.text }}
  {% endfor %}

  请全面扫描以上段落，发现所有 {{ category_labels | join('、') }} 类别的实体。
