[project]
name = "white-snake-agent"
version = "1.0.0"
description = "白蛇传数字博物馆 AI Agent 服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "jieba>=0.42",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "mcp>=1.0",
    "anthropic>=0.40",
    "tenacity>=9.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
